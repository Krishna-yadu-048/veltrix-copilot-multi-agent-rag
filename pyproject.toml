[project]
name = "veltrix-copilot"
version = "1.3.0"
description = "Veltrix Copilot: answers from Veltrix company documents and plans business trips under the Veltrix travel policy."
readme = "README.md"
requires-python = ">=3.11"
# Pinned versions that were installed and tested together. uv.lock pins everything else.
dependencies = [
    # Orchestration
    "langgraph==1.2.18",
    "langgraph-checkpoint==4.3.1",
    # Local LLM (Ollama) client
    "ollama==0.6.3",
    # MCP (tool servers + client)
    "mcp==1.30.0",
    # API + web app
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "streamlit==1.66.1",
    "httpx==0.28.1",
    # Config + validation
    "pydantic==2.13.5",
    "pydantic-settings==2.16.2",
    # Data layer
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.1",
    # Ingestion
    "langchain-text-splitters==1.1.3",
    "pypdf==6.17.0",
    "python-docx==1.2.0",
    # Google Calendar
    "google-api-python-client==2.201.0",
    "google-auth==2.62.0",
    "google-auth-oauthlib==1.5.0",
    "google-auth-httplib2==0.4.4",
    # Time zones on Windows (zoneinfo needs this database there)
    "tzdata==2026.6",
]

[dependency-groups]
dev = ["pytest==9.1.1"]   # installed by `uv sync` by default; `uv sync --no-dev` skips it

[tool.uv]
package = false           # an app run from this folder, not a library to install

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
